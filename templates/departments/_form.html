<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-4 backdrop-blur-sm">
    <div class="bg-surface border border-border rounded-xl shadow-xl w-full max-w-md p-6 space-y-4 text-text-primary">
        <div class="flex justify-between items-center border-b border-border pb-3">
            <h3 class="text-lg font-bold text-text-primary">
                {% if department %}Edit Department{% else %}Add Department{% endif %}
            </h3>
            <button onclick="document.getElementById('modal-container').innerHTML=''" class="text-text-muted hover:text-text-primary">✕</button>
        </div>

        <form hx-post="{% if department %}{% url 'department-edit-form' department.id %}{% else %}{% url 'department-create-form' %}{% endif %}"
              hx-target="#modal-container"
              class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-text-secondary">Department Name</label>
                <input type="text" name="department_name" value="{{ department.department_name|default:'' }}" required
                       class="mt-1 block w-full rounded-lg bg-elevated border border-border px-3 py-2 text-sm text-text-primary focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent">
                {% if errors.department_name %}<p class="text-xs text-danger mt-1">{{ errors.department_name }}</p>{% endif %}
            </div>

            <div>
                <label class="block text-sm font-medium text-text-secondary">Location</label>
                <input type="text" name="location" value="{{ department.location|default:'' }}" required
                       class="mt-1 block w-full rounded-lg bg-elevated border border-border px-3 py-2 text-sm text-text-primary focus:border-accent focus:outline-none focus:ring-1 focus:ring-accent">
                {% if errors.location %}<p class="text-xs text-danger mt-1">{{ errors.location }}</p>{% endif %}
            </div>

            <div class="flex justify-end space-x-3 pt-4 border-t border-border">
                <button type="button" onclick="document.getElementById('modal-container').innerHTML=''"
                        class="px-4 py-2 text-sm font-medium text-text-secondary bg-transparent border border-muted-accent rounded-lg hover:bg-muted-accent/15 hover:text-text-primary">Cancel</button>
                <button type="submit" class="px-4 py-2 text-sm font-semibold text-[#0B1210] bg-accent rounded-lg hover:bg-accent-hover transition">Save Department</button>
            </div>
        </form>
    </div>
</div>
