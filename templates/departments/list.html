{% extends "base.html" %}

{% block title %}Departments — Workforcely{% endblock %}

{% block content %}
<div class="space-y-6" hx-on="departmentChanged: htmx.trigger('#dept-table-trigger', 'load'); document.getElementById('modal-container').innerHTML=''">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-text-primary">Departments</h1>
            <p class="text-sm text-text-secondary">Configure corporate organizational units and offices.</p>
        </div>
        <button hx-get="{% url 'department-create-form' %}"
                hx-target="#modal-container"
                class="px-4 py-2.5 bg-accent hover:bg-accent-hover text-[#0B1210] font-semibold text-sm rounded-lg shadow-sm flex items-center justify-center space-x-2 transition">
            <span>+ Add Department</span>
        </button>
    </div>

    <div id="dept-table-trigger" hx-get="{% url 'department-table-partial' %}" hx-trigger="load">
        <div class="animate-pulse space-y-2">
            <div class="h-10 bg-surface rounded-lg border border-border"></div>
            <div class="h-12 bg-surface rounded-lg border border-border"></div>
        </div>
    </div>
</div>
{% endblock %}
